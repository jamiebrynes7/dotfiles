name: Archive completed beans

on:
  schedule:
    - cron: "0 5 * * 1" # Run every Monday at 5 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  archive-beans:
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets
        id: op
        uses: 1password/load-secrets-action@v5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          POPPET_BOT_CLIENT_ID: op://dev/poppet-bot-github/username
          POPPET_BOT_PRIVATE_KEY: op://dev/poppet-bot-github/poppet-bot.2026-04-26.private-key.pem

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ steps.op.outputs.POPPET_BOT_CLIENT_ID }}
          private-key: ${{ steps.op.outputs.POPPET_BOT_PRIVATE_KEY }}

      - name: Archive completed beans
        uses: jamiebrynes7/beans-archive-action@510470a2e19250511f8ef655200d41a209b8d849
        with:
          token: ${{ steps.app-token.outputs.token }}
