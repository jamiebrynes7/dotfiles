name: Archive completed beans

on:
  schedule:
    - cron: "0 5 * * 1" # Run every Monday at 5 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  archive-beans:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.POPPET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.POPPET_BOT_PRIVATE_KEY }}

      - name: Archive completed beans
        uses: jamiebrynes7/beans-archive-action@510470a2e19250511f8ef655200d41a209b8d849
        with:
          token: ${{ steps.app-token.outputs.token }}
