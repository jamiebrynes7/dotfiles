name: Auto update dependencies

on:
  schedule:
    - cron: "0 5 * * *" # Run every day at 5 AM
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.POPPET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.POPPET_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      # Every script runs even if an earlier one fails, so one broken upstream
      # cannot block every other package's update. Failures are collected and
      # reported at the end of the job, after the PR for whatever did succeed.
      - name: Update packages
        id: update
        run: |
          failed=""
          for script in packages/*/update.sh; do
            echo "::group::$script"
            if ! bash "$script"; then
              echo "::error title=Update failed::$script exited non-zero"
              failed="$failed $script"
            fi
            echo "::endgroup::"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- packages/; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "timestamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "packages: update versions"
          title: "packages: update versions"
          body: |
            Updates `hashes.json` for each package under `packages/` to its latest upstream release.
          branch: update-packages-${{ steps.check.outputs.timestamp }}
          delete-branch: true

      - name: Merge Pull Request
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --rebase --delete-branch

      # Last, so a broken update script still surfaces as a red job without
      # having suppressed the updates that did work.
      - name: Report failed updates
        if: steps.update.outputs.failed != ''
        run: |
          echo "These update scripts failed:" >&2
          for script in ${{ steps.update.outputs.failed }}; do echo "  - $script" >&2; done
          exit 1
