name: Update flake lock

# Manual only. This lock is the single source of truth for every machine --
# templates/systems/* declare nothing but `dotfiles.url` -- so a bump here
# reaches the whole fleet on its next `just update`. That is a decision to take
# deliberately, not on a cron.
on:
  workflow_dispatch:
    inputs:
      flake-inputs:
        description: "Space-separated inputs to update (blank = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  # Locking and re-pinning are platform-independent, so Linux is enough here.
  # CI is Linux-only too, so a nixpkgs-darwin move lands unvalidated and first
  # builds on a Mac at its next `just update`.
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.POPPET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.POPPET_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      # nixpkgs and nixpkgs-darwin are two Hydra-gated pointers into the same
      # release-26.05 history, so they differ only in staleness and are always
      # bumped together -- which is what the blank default does.
      - name: Update flake lock
        id: update
        shell: bash
        env:
          FLAKE_INPUTS: ${{ inputs.flake-inputs }}
        run: |
          read -r -a targets <<< "$FLAKE_INPUTS"
          nix flake update "${targets[@]}" 2>&1 | tee /tmp/flake-update.log
          # Nix reports each move as a `• Updated input ...` block, with the old
          # and new refs on indented continuation lines. That block is the
          # reviewable content of this PR, so it goes in the body.
          {
            echo 'summary<<FLAKE_UPDATE_EOF'
            grep -E "^(•|[[:space:]]+('|→))" /tmp/flake-update.log || true
            echo 'FLAKE_UPDATE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- flake.lock; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "timestamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_OUTPUT"
          fi

      # beans and paseo compute hashes against *this repo's* pinned nixpkgs
      # (fetchPnpmDeps/buildGoModule and prefetch-npm-deps respectively), so
      # moving the lock can invalidate them. Both are re-forced at the
      # version/rev already recorded, which keeps this PR a lock bump and
      # nothing more -- without the pin, `--force` would also pull in whatever
      # upstream released since.
      - name: Re-pin nixpkgs-derived hashes
        if: steps.check.outputs.update_needed == 'true'
        run: |
          bash packages/paseo/update.sh --force "$(jq -r .version packages/paseo/hashes.json)"
          bash packages/beans/update.sh --force "$(jq -r .rev packages/beans/data.json)"

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "flake.lock: update inputs"
          title: "flake.lock: update inputs"
          body: |
            ```
            ${{ steps.update.outputs.summary }}
            ```

            Any `packages/` changes are re-pinned hashes for the new nixpkgs, not version bumps.
          branch: update-flake-lock-${{ steps.check.outputs.timestamp }}
          delete-branch: true

      - name: Merge Pull Request
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --rebase --delete-branch
